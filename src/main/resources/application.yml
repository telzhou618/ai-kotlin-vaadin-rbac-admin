server:
  port: 8080
spring:
  application:
    name: rbac-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/rbac_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
  sql:
    init:
      mode: never
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      password:  # 如果 Redis 设置了密码，在这里填写
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 使用 SLF4J 日志实现，通过 logback 配置控制输出内容
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

# Sa-Token
sa-token:
  token-name: satoken
  timeout: 2592000
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

# Vaadin
vaadin:
  launch-browser: false
  pnpm:
    enable: true
  # 配置白名单包，加速启动（只扫描这些包）
  whitelisted-packages: com.rbac,com.vaadin,org.vaadin
# log
logging:
  level:
    root: INFO
    com.rbac: DEBUG
